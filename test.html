{% extends "base.html" %}

{% block title %}Mock Test{% endblock %}

{% block content %}

<h2>📝 Mock Test</h2>

<form method="POST">
    <p>1. What is 2 + 2?</p>
    <input type="text" name="q1"><br><br>

    <p>2. What is a stack?</p>
    <input type="text" name="q2"><br><br>

    <button type="submit">Submit Test</button>
</form>

{% if result %}
    <h3>Result</h3>
    <p>Score: {{ result.score }}/{{ result.total }}</p>
    <p>Level: {{ result.level }}</p>
{% endif %}

{% endblock %}
